<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c0d" media="(prefers-color-scheme: dark)">

{%- comment -%} set the theme before first paint {%- endcomment -%}
<script>
(function () {
  try {
    var t = localStorage.getItem("gpai-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>

{% seo %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="alternate" type="application/json" title="{{ site.title }} — index" href="{{ '/index.json' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/mark.svg' | relative_url }}" type="image/svg+xml">
<link rel="canonical" href="{{ page.url | absolute_url }}">
