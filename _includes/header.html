<header class="bar">
  <div class="shell bar__in">
    <a class="brand" href="{{ '/' | relative_url }}">GPAI<span class="brand__dot">.</span>WIKI</a>

    <nav class="nav" aria-label="Sections">
      {%- for item in site.data.nav %}
      <a class="nav__a" href="{{ item.url | relative_url }}"
         {% if page.section == item.key %}aria-current="page"{% endif %}>{{ item.label }}</a>
      {%- endfor %}
    </nav>

    <div class="bar__end">
      <a class="iconbtn" href="{{ site.repo_url }}" rel="noopener" aria-label="Repository on GitHub" title="Repository">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8a7.2 7.2 0 0 0-2.28 14c.36.07.5-.15.5-.35v-1.2c-2 .44-2.43-.97-2.43-.97-.33-.83-.8-1.06-.8-1.06-.66-.45.05-.44.05-.44.73.05 1.11.75 1.11.75.65 1.1 1.7.79 2.11.6.07-.47.25-.79.46-.97-1.6-.18-3.28-.8-3.28-3.56 0-.79.28-1.43.74-1.93-.07-.19-.32-.92.07-1.91 0 0 .6-.2 1.98.73a6.9 6.9 0 0 1 3.6 0c1.38-.93 1.98-.73 1.98-.73.39 1 .14 1.72.07 1.9.46.51.74 1.15.74 1.94 0 2.77-1.69 3.38-3.3 3.56.26.22.49.66.49 1.34v1.98c0 .2.13.42.5.35A7.2 7.2 0 0 0 8 .8Z" stroke="none" fill="currentColor"/></svg>
      </a>
      <button class="iconbtn" id="theme" aria-label="Toggle colour scheme" title="Toggle colour scheme">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="4.6"/>
          <path d="M8 3.4v9.2" stroke-width="0"/>
          <path d="M8 3.4a4.6 4.6 0 0 1 0 9.2Z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </div>
</header>
