---
layout: default
---
<div class="shell">
  <header class="phead">
    {%- if page.kicker %}<div class="phead__kicker">{{ page.kicker }}</div>{% endif %}
    <h1 class="phead__h">{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="phead__sub">{{ page.subtitle }}</p>{% endif %}
  </header>

  {%- if page.toc %}
  <div class="doc">
    <div class="doc__body"><article class="prose">{{ content }}</article></div>
    <aside class="doc__rail">
      <div class="rail__blk"><div class="toc__h">Contents</div><nav id="toc"></nav></div>
    </aside>
  </div>
  {%- else %}
  <article class="prose">{{ content }}</article>
  {%- endif %}
</div>
